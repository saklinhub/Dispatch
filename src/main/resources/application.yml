server:
  port: ${PORT:8080}

spring:
  application:
    name: dispatch

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:dispatch_db}}
    username: ${DB_USERNAME:dispatch}
    password: ${DB_PASSWORD:dispatch}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

dispatch:
  jwt:
    secret: ${JWT_SECRET:dispatch-super-secret-key-minimum-256-bits-change-in-prod}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

  rabbitmq:
    notification-exchange: dispatch.notifications
    notification-routing-key: notification.process
    notification-queue: dispatch.notifications.queue
    dlq-exchange: dispatch.dlq
    dlq-queue: dispatch.dlq.queue
    outbox-exchange: dispatch.outbox
    outbox-routing-key: outbox.publish
    outbox-queue: dispatch.outbox.queue
    retry-max-attempts: 3

  mail:
    from-address: ${MAIL_FROM:noreply@dispatch.io}
    from-name: ${MAIL_FROM_NAME:Dispatch Notifications}

  sms:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}
    messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}
    enabled: ${SMS_ENABLED:false}

  outbox:
    polling-interval-ms: 5000
    batch-size: 50

  recovery:
    stuck-threshold-minutes: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

logging:
  level:
    com.dispatch: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
